<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
  </defs>
  
  <!-- Background plate -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  
  <!-- Terminal panes - "the herd" arranged in formation -->
  <!-- Back row (smaller, further) -->
  <g opacity="0.6">
    <rect x="80" y="120" width="70" height="55" rx="6" fill="url(#termGrad)" stroke="#4a5568" stroke-width="2"/>
    <rect x="84" y="124" width="62" height="10" rx="2" fill="#2d3748"/>
    <circle cx="92" cy="129" r="3" fill="#fc8181"/>
    <circle cx="102" cy="129" r="3" fill="#f6e05e"/>
    <circle cx="112" cy="129" r="3" fill="#68d391"/>
    <rect x="88" y="140" width="30" height="3" rx="1" fill="#68d391"/>
    <rect x="88" y="148" width="45" height="3" rx="1" fill="#a0aec0"/>
    <rect x="88" y="156" width="20" height="3" rx="1" fill="#63b3ed"/>
  </g>
  
  <g opacity="0.6">
    <rect x="170" y="100" width="70" height="55" rx="6" fill="url(#termGrad)" stroke="#4a5568" stroke-width="2"/>
    <rect x="174" y="104" width="62" height="10" rx="2" fill="#2d3748"/>
    <circle cx="182" cy="109" r="3" fill="#fc8181"/>
    <circle cx="192" cy="109" r="3" fill="#f6e05e"/>
    <circle cx="202" cy="109" r="3" fill="#68d391"/>
    <rect x="178" y="120" width="35" height="3" rx="1" fill="#f6e05e"/>
    <rect x="178" y="128" width="50" height="3" rx="1" fill="#a0aec0"/>
    <rect x="178" y="136" width="25" height="3" rx="1" fill="#68d391"/>
  </g>
  
  <!-- Middle row -->
  <g opacity="0.8">
    <rect x="55" y="200" width="85" height="70" rx="8" fill="url(#termGrad)" stroke="#4a5568" stroke-width="2"/>
    <rect x="60" y="205" width="75" height="12" rx="3" fill="#2d3748"/>
    <circle cx="70" cy="211" r="4" fill="#fc8181"/>
    <circle cx="82" cy="211" r="4" fill="#f6e05e"/>
    <circle cx="94" cy="211" r="4" fill="#68d391"/>
    <rect x="64" y="224" width="40" height="4" rx="2" fill="#68d391"/>
    <rect x="64" y="234" width="65" height="4" rx="2" fill="#a0aec0"/>
    <rect x="64" y="244" width="30" height="4" rx="2" fill="#63b3ed"/>
    <rect x="64" y="254" width="50" height="4" rx="2" fill="#a0aec0"/>
  </g>
  
  <g opacity="0.8">
    <rect x="160" y="185" width="85" height="70" rx="8" fill="url(#termGrad)" stroke="#4a5568" stroke-width="2"/>
    <rect x="165" y="190" width="75" height="12" rx="3" fill="#2d3748"/>
    <circle cx="175" cy="196" r="4" fill="#fc8181"/>
    <circle cx="187" cy="196" r="4" fill="#f6e05e"/>
    <circle cx="199" cy="196" r="4" fill="#68d391"/>
    <rect x="169" y="209" width="45" height="4" rx="2" fill="#f6e05e"/>
    <rect x="169" y="219" width="60" height="4" rx="2" fill="#a0aec0"/>
    <rect x="169" y="229" width="35" height="4" rx="2" fill="#fc8181"/>
    <rect x="169" y="239" width="55" height="4" rx="2" fill="#a0aec0"/>
  </g>
  
  <!-- Front row (largest, closest) - the lead agents -->
  <g>
    <rect x="70" y="300" width="100" height="85" rx="10" fill="url(#termGrad)" stroke="#68d391" stroke-width="3"/>
    <rect x="76" y="306" width="88" height="14" rx="4" fill="#2d3748"/>
    <circle cx="88" cy="313" r="4" fill="#fc8181"/>
    <circle cx="102" cy="313" r="4" fill="#f6e05e"/>
    <circle cx="116" cy="313" r="4" fill="#68d391"/>
    <rect x="82" y="328" width="50" height="5" rx="2" fill="#68d391"/>
    <rect x="82" y="340" width="75" height="5" rx="2" fill="#a0aec0"/>
    <rect x="82" y="352" width="40" height="5" rx="2" fill="#63b3ed"/>
    <rect x="82" y="364" width="60" height="5" rx="2" fill="#a0aec0"/>
    <!-- Status indicator: idle (green) -->
    <circle cx="155" cy="313" r="6" fill="#68d391"/>
  </g>
  
  <g>
    <rect x="190" y="290" width="100" height="85" rx="10" fill="url(#termGrad)" stroke="#f6e05e" stroke-width="3"/>
    <rect x="196" y="296" width="88" height="14" rx="4" fill="#2d3748"/>
    <circle cx="208" cy="303" r="4" fill="#fc8181"/>
    <circle cx="222" cy="303" r="4" fill="#f6e05e"/>
    <circle cx="236" cy="303" r="4" fill="#68d391"/>
    <rect x="202" y="318" width="55" height="5" rx="2" fill="#f6e05e"/>
    <rect x="202" y="330" width="70" height="5" rx="2" fill="#a0aec0"/>
    <rect x="202" y="342" width="35" height="5" rx="2" fill="#63b3ed"/>
    <rect x="202" y="354" width="65" height="5" rx="2" fill="#a0aec0"/>
    <!-- Status indicator: working (yellow, animated pulse effect via opacity) -->
    <circle cx="275" cy="303" r="6" fill="#f6e05e"/>
  </g>
  
  <!-- Shepherd's crook / guide element on right side -->
  <g transform="translate(320, 140)">
    <!-- Stylized shepherd's crook made of circuit/terminal aesthetic -->
    <path d="M 60 0 
             Q 120 0, 120 60 
             Q 120 120, 60 120 
             L 60 280
             Q 60 320, 30 320
             L 30 280" 
          fill="none" 
          stroke="#68d391" 
          stroke-width="16" 
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"/>
    
    <!-- Inner glow -->
    <path d="M 60 0 
             Q 120 0, 120 60 
             Q 120 120, 60 120 
             L 60 280
             Q 60 320, 30 320
             L 30 280" 
          fill="none" 
          stroke="#9ae6b4" 
          stroke-width="6" 
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.5"/>
    
    <!-- Small terminal nodes along the crook -->
    <rect x="100" y="45" width="24" height="18" rx="3" fill="#2d3748" stroke="#68d391" stroke-width="1.5"/>
    <rect x="103" y="49" width="10" height="2" fill="#68d391"/>
    <rect x="103" y="54" width="15" height="2" fill="#a0aec0"/>
    
    <rect x="45" y="180" width="24" height="18" rx="3" fill="#2d3748" stroke="#68d391" stroke-width="1.5"/>
    <rect x="48" y="184" width="12" height="2" fill="#f6e05e"/>
    <rect x="48" y="189" width="16" height="2" fill="#a0aec0"/>
    
    <rect x="15" y="265" width="24" height="18" rx="3" fill="#2d3748" stroke="#68d391" stroke-width="1.5"/>
    <rect x="18" y="269" width="8" height="2" fill="#fc8181"/>
    <rect x="18" y="274" width="14" height="2" fill="#a0aec0"/>
  </g>
  
  <!-- "herdr-mcp" text at bottom -->
  <text x="256" y="470" 
        font-family="SF Mono, Monaco, Consolas, monospace" 
        font-size="36" 
        font-weight="bold" 
        fill="#e2e8f0" 
        text-anchor="middle">herdr-mcp</text>
</svg>
