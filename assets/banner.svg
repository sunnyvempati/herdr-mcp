<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="mcpGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#68d391;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#68d391;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#68d391;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Left side: Herdr wordmark + terminal mockup -->
  <g transform="translate(60, 50)">
    <!-- Herdr wordmark -->
    <text x="0" y="50" 
          font-family="SF Mono, Monaco, Consolas, monospace" 
          font-size="48" 
          font-weight="bold" 
          fill="#f0f6fc">herdr</text>
    <text x="0" y="80" 
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="16" 
          fill="#8b949e">Terminal workspace for AI agents</text>
    
    <!-- Mini terminal showing agent list -->
    <g transform="translate(0, 110)">
      <rect width="320" height="180" rx="8" fill="url(#termBg)" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="320" height="28" rx="8" fill="#21262d"/>
      <rect x="0" y="20" width="320" height="8" fill="#161b22"/>
      
      <!-- Window controls -->
      <circle cx="18" cy="14" r="6" fill="#f85149"/>
      <circle cx="38" cy="14" r="6" fill="#f0883e"/>
      <circle cx="58" cy="14" r="6" fill="#3fb950"/>
      
      <!-- Terminal title -->
      <text x="160" y="18" 
            font-family="SF Mono, Monaco, Consolas, monospace" 
            font-size="12" 
            fill="#8b949e" 
            text-anchor="middle">herdr agent list</text>
      
      <!-- Agent status list -->
      <g transform="translate(16, 44)" font-family="SF Mono, Monaco, Consolas, monospace" font-size="13">
        <text x="0" y="0" fill="#8b949e">AGENT</text>
        <text x="120" y="0" fill="#8b949e">STATUS</text>
        <text x="200" y="0" fill="#8b949e">PANE</text>
        
        <circle cx="4" cy="22" r="5" fill="#3fb950"/>
        <text x="16" y="26" fill="#c9d1d9">reviewer</text>
        <text x="120" y="26" fill="#3fb950">idle</text>
        <text x="200" y="26" fill="#6e7681">w1:p1</text>
        
        <circle cx="4" cy="46" r="5" fill="#f0883e"/>
        <text x="16" y="50" fill="#c9d1d9">feature</text>
        <text x="120" y="50" fill="#f0883e">working</text>
        <text x="200" y="50" fill="#6e7681">w1:p2</text>
        
        <circle cx="4" cy="70" r="5" fill="#f85149"/>
        <text x="16" y="74" fill="#c9d1d9">docs</text>
        <text x="120" y="74" fill="#f85149">blocked</text>
        <text x="200" y="74" fill="#6e7681">w2:p1</text>
        
        <circle cx="4" cy="94" r="5" fill="#58a6ff"/>
        <text x="16" y="98" fill="#c9d1d9">tests</text>
        <text x="120" y="98" fill="#58a6ff">done</text>
        <text x="200" y="98" fill="#6e7681">w2:p2</text>
      </g>
    </g>
  </g>
  
  <!-- Center: MCP connection line with glow -->
  <g transform="translate(440, 170)">
    <!-- Connection line -->
    <line x1="0" y1="30" x2="320" y2="30" stroke="#30363d" stroke-width="3" stroke-dasharray="8,4"/>
    
    <!-- Animated data packets (static representation) -->
    <circle cx="80" cy="30" r="6" fill="#3fb950" opacity="0.8"/>
    <circle cx="160" cy="30" r="6" fill="#3fb950" opacity="0.6"/>
    <circle cx="240" cy="30" r="6" fill="#3fb950" opacity="0.4"/>
    
    <!-- MCP label -->
    <rect x="120" y="10" width="80" height="40" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="160" y="36" 
          font-family="SF Mono, Monaco, Consolas, monospace" 
          font-size="16" 
          font-weight="bold" 
          fill="#3fb950" 
          text-anchor="middle">MCP</text>
  </g>
  
  <!-- Right side: Grok Bot / Cursor / Claude wordmarks -->
  <g transform="translate(800, 50)">
    <!-- "Works with" header -->
    <text x="180" y="30" 
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="14" 
          fill="#8b949e" 
          text-anchor="middle">AI Assistants</text>
    
    <!-- Stacked client names -->
    <g transform="translate(0, 60)">
      <rect x="40" y="0" width="280" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="180" y="30" 
            font-family="SF Mono, Monaco, Consolas, monospace" 
            font-size="22" 
            font-weight="bold" 
            fill="#f0f6fc" 
            text-anchor="middle">Grok Bot</text>
    </g>
    
    <g transform="translate(0, 115)">
      <rect x="40" y="0" width="280" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="180" y="30" 
            font-family="SF Mono, Monaco, Consolas, monospace" 
            font-size="22" 
            font-weight="bold" 
            fill="#f0f6fc" 
            text-anchor="middle">Cursor</text>
    </g>
    
    <g transform="translate(0, 170)">
      <rect x="40" y="0" width="280" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="180" y="30" 
            font-family="SF Mono, Monaco, Consolas, monospace" 
            font-size="22" 
            font-weight="bold" 
            fill="#f0f6fc" 
            text-anchor="middle">Claude</text>
    </g>
    
    <text x="180" y="250" 
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="13" 
          fill="#6e7681" 
          text-anchor="middle">+ any MCP client</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="600" y="370" 
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
        font-size="18" 
        fill="#8b949e" 
        text-anchor="middle">Monitor and control your AI coding agents from any assistant</text>
  
  <!-- herdr-mcp title overlay -->
  <text x="600" y="385" 
        font-family="SF Mono, Monaco, Consolas, monospace" 
        font-size="11" 
        fill="#6e7681" 
        text-anchor="middle"
        opacity="0.7">github.com/sunnyvempati/herdr-mcp</text>
</svg>
